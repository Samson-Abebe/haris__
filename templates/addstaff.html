<div class="w-full max-w-3xl mx-auto my-auto p-2">
    <!-- Form Header -->
    <div class="mb-6 text-center md:text-left">
        <h2 class="text-xl font-bold text-slate-800">Registration Form</h2>
        <p class="text-sm text-slate-500">Fill in the details below to add a new staff member to the system.</p>
    </div>

    <!-- Main Registration Form -->
    <form action="{{f}}" method="POST" class="space-y-6 w-full">
        
        <!-- Row 1: Full Name & Email Address -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
                <label for="name" class="block text-sm font-semibold text-slate-700 mb-2">
                    <i class="fa-solid fa-user text-slate-400 mr-1"></i> Full Name
                </label>
                <input type="text" id="name" name="name" required placeholder="e.g. John Doe"
                    class="w-full px-4 py-2.5 rounded-lg border border-slate-200 bg-slate-50/50 text-slate-800 focus:bg-white focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 transition-all outline-none">
            </div>
            
            <div>
                <label for="email" class="block text-sm font-semibold text-slate-700 mb-2">
                    <i class="fa-solid fa-envelope text-slate-400 mr-1"></i> Email Address
                </label>
                <input type="email" id="email" name="email" required placeholder="name@company.com"
                    class="w-full px-4 py-2.5 rounded-lg border border-slate-200 bg-slate-50/50 text-slate-800 focus:bg-white focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 transition-all outline-none">
            </div>
        </div>

        <!-- Row 2: Department (Cleaned up structural tag error) -->
          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div>
            <label for="department" class="block text-sm font-semibold text-slate-700 mb-2">
                <i class="fa-solid fa-building text-slate-400 mr-1"></i> Department
            </label>
            <select id="department" name="department" required
                class="w-full px-4 py-2.5 rounded-lg border border-slate-200 bg-slate-50/50 text-slate-800 focus:bg-white focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 transition-all outline-none appearance-none cursor-pointer">
              
                <option value="2">Store Manager</option>
                <option value="3">Cashier</option>
                <option value="4">Sales Person</option>
            >       
            </select>


             
        </div>
           <div>
                <label for="email" class="block text-sm font-semibold text-slate-700 mb-2">
                    <i class="fa-solid fa-lock menu-icon-default"></i> Pass Word
                </label>
                <input type="text" id="email_" name="password" required placeholder="**********"
                    class="w-full px-4 py-2.5 rounded-lg border border-slate-200 bg-slate-50/50 text-slate-800 focus:bg-white focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 transition-all outline-none">
            </div>
        </div>


        <!-- Row 3: Phone Number & Employment Type -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
                <label for="phone" class="block text-sm font-semibold text-slate-700 mb-2">
                    <i class="fa-solid fa-phone text-slate-400 mr-1"></i> Phone Number
                </label>
                <input type="tel" id="phone" name="phone" placeholder="+251*********"  pattern="^\+251\d{9}$"
                    class="w-full px-4 py-2.5 rounded-lg border border-slate-200 bg-slate-50/50 text-slate-800 focus:bg-white focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 transition-all outline-none">
            </div>

            <div>
                <label for="employment_type" class="block text-sm font-semibold text-slate-700 mb-2">
                    <i class="fa-solid fa-clock text-slate-400 mr-1"></i> Employment Type
                </label>
                <div class="flex items-center gap-6 py-2.5">
                    <label class="inline-flex items-center text-sm text-slate-700 cursor-pointer">
                        <input type="radio" name="employment_type" value="Agent" checked class="w-4 h-4 text-indigo-600 border-slate-300 focus:ring-indigo-500">
                        <span class="ml-2">agent</span>
                    </label>
                    <label class="inline-flex items-center text-sm text-slate-700 cursor-pointer">
                        <input type="radio" name="employment_type" value="Staff" class="w-4 h-4 text-indigo-600 border-slate-300 focus:ring-indigo-500">
                        <span class="ml-2">staff</span>
                    </label>
                </div>
            </div>
        </div>

        <!-- Submit Button Row -->
        <div class="pt-4 border-t border-slate-100 flex flex-col sm:flex-row items-center justify-end gap-3">
            <button type="reset" 
                class="w-full sm:w-auto px-5 py-2.5 rounded-lg border border-slate-200 text-slate-600 font-medium hover:bg-slate-50 transition-colors cursor-pointer text-center">
                Clear Form
            </button>
            <button type="submit" 
                class="w-full sm:w-auto px-6 py-2.5 rounded-lg bg-indigo-600 text-white font-semibold hover:bg-indigo-700 shadow-sm shadow-indigo-200 transition-colors cursor-pointer text-center">
                <i class="fa-solid fa-plus mr-1.5"></i> Save Staff Member
            </button>
        </div>
    </form>
</div>
