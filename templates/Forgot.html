<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card-forgot {
            width: 100%;
            max-width: 420px;
            border: none;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,.08);
        }

        .icon-circle {
            width: 70px;
            height: 70px;
            background: #0d6efd;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            margin: auto;
        }

        .btn-submit {
            height: 50px;
            font-weight: 600;
            border-radius: 12px;
        }

        .phone-input {
            height: 50px;
            border-radius: 12px;
        }
    </style>
</head>
<body>

<div class="container px-3">
    <div class="card card-forgot mx-auto">
        <div class="card-body p-4 p-md-5">

            <div class="text-center mb-4">
                <div class="icon-circle mb-3">
                    📱
                </div>

                <h3 class="fw-bold">Forgot Password?</h3>

                <p class="text-muted">
                    Enter your phone number and we'll help you reset your password.
                </p>
            </div>

            <form method="POST" action="/Forgot">

                <div class="mb-3">
                    <label class="form-label fw-semibold">
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        class="form-control phone-input"
                        name="phone"
                        placeholder="09XXXXXXXX"
                        required
                    >
                </div>

                <button type="submit"
                        class="btn btn-primary w-100 btn-submit">
                    Continue
                </button>

            </form>

            <div class="text-center mt-4">
                <a href="/" class="text-decoration-none">
                    ← Back to Login
                </a>
            </div>

        </div>
    </div>
</div>

</body>
</html>
