<!-- Fixed Notification Overlay Container (Stays floating in top-right corner) -->
<div id="notification-container" class="fixed top-5 right-5 z-50 space-y-3 w-full max-w-sm pointer-events-none">
    
    <!-- EXAMPLE 1: Success Notification (Jinja conditional block example) -->
    {% if su %}
    <div class="pharmacy-toast flex items-start p-4 rounded-xl bg-white border border-emerald-100 shadow-xl shadow-slate-200/50 pointer-events-auto transform transition-all duration-300 ease-out" role="alert">
        <div class="flex-shrink-0 flex items-center justify-center w-8 h-8 rounded-lg bg-emerald-50 text-emerald-600">
            <i class="fa-solid fa-circle-check"></i>
        </div>
        <div class="ml-3 flex-1 pt-0.5">
            <p class="text-sm font-semibold text-slate-800">Operation Successful</p>
            <p class="text-xs text-slate-500 mt-0.5">{{ su }}</p>
        </div>
        <button onclick="dismissNotification(this.closest('.pharmacy-toast'))" class="ml-4 flex-shrink-0 text-slate-400 hover:text-slate-600 transition-colors cursor-pointer">
            <i class="fa-solid fa-xmark text-sm"></i>
        </button>
    </div>
    {% endif %}

    <!-- EXAMPLE 2: Danger / Error Notification -->
    {% if er %}
    <div class="pharmacy-toast flex items-start p-4 rounded-xl bg-white border border-rose-100 shadow-xl shadow-slate-200/50 pointer-events-auto transform transition-all duration-300 ease-out" role="alert">
        <div class="flex-shrink-0 flex items-center justify-center w-8 h-8 rounded-lg bg-rose-50 text-rose-600">
            <i class="fa-solid fa-circle-exclamation"></i>
        </div>
        <div class="ml-3 flex-1 pt-0.5">
            <p class="text-sm font-semibold text-slate-800">Action Failed</p>
            <p class="text-xs text-slate-500 mt-0.5">{{ su }}</p>
        </div>
        <button onclick="dismissNotification(this.closest('.pharmacy-toast'))" class="ml-4 flex-shrink-0 text-slate-400 hover:text-slate-600 transition-colors cursor-pointer">
            <i class="fa-solid fa-xmark text-sm"></i>
        </button>
    </div>
    {% endif %}

</div>

<!-- JavaScript to handle automatic disappearing animations -->
<script>
    // 1. Automatically remove notifications after 4 seconds (4000ms)
    document.addEventListener("DOMContentLoaded", function() {
        const toasts = document.querySelectorAll('.pharmacy-toast');
        toasts.forEach(toast => {
            setTimeout(() => {
                dismissNotification(toast);
            }, 4000); 
        });
    });

    // 2. Reuseable function to animate out and completely remove the element
    function dismissNotification(toastElement) {
        if (!toastElement) return;
        
        // Apply Tailwind sliding and opacity out transitions
        toastElement.classList.add('opacity-0', 'translate-x-12', 'scale-95');
        
        // Wait for the CSS animation transition duration (300ms) to complete before removing from DOM
        setTimeout(() => {
            toastElement.remove();
        }, 300);
    }
</script>
