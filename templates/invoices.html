<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

<style>
    .select2-container {
        display: block !important;
        width: 100% !important;
    }
    .select2-container--default .select2-selection--single {
        background-color: rgba(248, 250, 252, 0.5) !important;
        border: 1px solid #e2e8f0 !important;
        border-radius: 0.5rem !important;
        min-height: 44px !important;
        display: flex !important;
        align-items: center !important;
    }
    .select2-container--default .select2-selection--single .select2-selection__rendered {
        color: #1e293b !important;
        padding-left: 1rem !important;
        font-size: 0.875rem !important;
    }
    .select2-container--default .select2-selection--single .select2-selection__arrow {
        height: 42px !important;
        right: 10px !important;
    }
    .select2-container--default.select2-container--open .select2-selection--single {
        border-color: #4f46e5 !important;
        background-color: #ffffff !important;
        box-shadow: 0 0 0 2px #e0e7ff !important;
    }
    .select2-dropdown {
        border: 1px solid #e2e8f0 !important;
        border-radius: 0.5rem !important;
        box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1) !important;
        z-index: 99999 !important;
        background-color: #ffffff !important;
    }
    .select2-search--dropdown {
        padding: 8px !important;
        display: block !important;
        background-color: #ffffff !important;
    }
    .select2-search__field {
        width: 100% !important;
        box-sizing: border-box !important;
        border: 1px solid #cbd5e1 !important;
        border-radius: 0.375rem !important;
        padding: 6px 12px !important;
        outline: none !important;
    }
    .select2-container--default .select2-results__option--highlighted[aria-selected] {
        background-color: #4f46e5 !important;
    }
</style>

<div class="w-full max-w-4xl mx-auto my-auto p-2">
    <div class="mb-6 flex flex-col md:flex-row md:items-center md:justify-between border-b border-slate-100 pb-4">
        <div class="text-center md:text-left">
            <h2 class="text-xl font-bold text-slate-800">Create Sales Invoice</h2>
            <p class="text-sm text-slate-500">Select a customer, append medications, and calculate tax withholding rates.</p>
        </div>
        <div class="text-center md:text-right mt-2 md:mt-0">
            <span id="invoice-date" class="text-xs font-semibold px-3 py-1 bg-indigo-50 text-indigo-700 rounded-full">
               
            </span>
        </div>
    </div>

    <form action="{{f}}" method="POST"  enctype="multipart/form-data" class="space-y-6 w-full">
        
        <div class="bg-slate-50/50 p-4 rounded-xl border border-slate-100">
            <div class="w-full md:w-1/2">
                <label for="customer_select" class="block text-sm font-semibold text-slate-700 mb-2">
                    <i class="fa-solid fa-user-tag text-slate-400 mr-1"></i> Client / Customer Name
                </label>
                <select id="customer_select" name="customer_id" required class="w-full">
                    <option value="" disabled selected>Search registered customer...</option>
                    {% for x,y in s["s1"].items() %}
                    <option value="{{x}}">{{y}}</option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <div class="bg-slate-50/50 p-4 rounded-xl border border-slate-100">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label for="type" class="block text-sm font-semibold text-slate-700 mb-2">
                        <i class="fa-solid fa-credit-card text-slate-400 mr-1"></i> Credit Type
                    </label>
                    <select id="type" name="credit_type" required class="w-full p-2.5 bg-white border border-slate-200 rounded-lg text-sm text-slate-800 outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-100" onchange="toggleCreditTypeFields(this.value)">
                        <option value="" disabled selected>Select credit type...</option>
                        <option value="cash">Cash Sale</option>
                        <option value="credit">Credit</option>
                    </select>
                </div>

                <div id="bank-field-wrapper" class="hidden">
                    <label for="bank_select" class="block text-sm font-semibold text-slate-700 mb-2">
                        <i class="fa-solid fa-building-columns text-slate-400 mr-1"></i> Receiving Bank / Cash Desk
                    </label>
                    <select id="bank_select" name="bank_account" class="w-full p-2.5 bg-white border border-slate-200 rounded-lg text-sm text-slate-800 outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-100">
                        <option value="" disabled selected>Choose destination ledger...</option>
                           {% for x,y in s["s3"].items() %}
                    <option value="{{x}}">{{y}}</option>
                    {% endfor %}
                        
                    </select>
                </div>

                <div id="date-field-wrapper" class="hidden">
                    <label for="return_date" class="block text-sm font-semibold text-slate-700 mb-2">
                        <i class="fa-solid fa-calendar-day text-slate-400 mr-1"></i> Expected Return / Payment Date
                    </label>
                    <input type="date" id="return_date" name="payment_due_date" min="2026-05-25" class="w-full px-3 py-2 text-sm bg-white border border-slate-200 text-slate-800 rounded-lg outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-100">
                </div>
            </div>
        </div>

        <div>
            <h3 class="text-sm font-bold text-slate-700 mb-3 flex items-center">
                <i class="fa-solid fa-pills text-indigo-500 mr-2"></i> Prescribed Medication Items
            </h3>
            
            <div class="hidden md:grid grid-cols-12 gap-4 px-4 py-2 bg-slate-100 rounded-lg text-xs font-bold text-slate-600 mb-2">
                <div class="col-span-5">Drug Name</div>
                <div class="col-span-2">Unit Price (ETB)</div>
                <div class="col-span-2">Qty Requested</div>
                <div class="col-span-2 text-right">Total (ETB)</div>
                <div class="col-span-1 text-center">Action</div>
            </div>

            <div id="invoice-items-container" class="space-y-3"></div>

            <button type="button" onclick="addInvoiceRow()"
                class="mt-3 inline-flex items-center gap-1.5 px-4 py-2 rounded-lg border border-dashed border-indigo-300 text-indigo-600 hover:bg-indigo-50 text-xs font-semibold transition-colors cursor-pointer">
                <i class="fa-solid fa-plus-circle"></i> Append Extra Drug
            </button>
        </div>

        <div class="pt-4 border-t border-slate-100 flex justify-end">
            <div class="w-full md:w-80 space-y-3 bg-slate-50/50 p-4 rounded-xl border border-slate-100">
                <div class="flex justify-between items-center text-sm">
                    <span class="text-slate-500 font-medium">Subtotal:</span>
                    <span id="invoice-subtotal" class="font-semibold text-slate-800">0.00 ETB</span>
                </div>
                
                <div class="flex justify-between items-center text-sm border-b border-slate-200/60 pb-2">
                    <span class="text-slate-500 font-medium flex items-center">
                        Withholding Tax <span class="ml-1 px-1.5 py-0.5 text-[10px] bg-amber-50 text-amber-700 font-bold rounded">3%</span>
                    </span>
                    <span id="invoice-withholding" class="font-semibold text-amber-600">-0.00 ETB</span>
                </div>

                <div class="flex justify-between items-center pt-1">
                    <span class="text-base font-bold text-slate-800">Net Payable Total:</span>
                    <span id="invoice-grand-total" class="text-lg font-black text-indigo-600">0.00 ETB</span>
                </div>
            </div>
        </div>
        <input  type="file"  id="image"  name="image"  accept="image/*"  required>
        <input type="hidden" id="input_subtotal" name="subtotal_price" value="0.00">
        <input type="hidden" id="input_withholding" name="withholding_tax" value="0.00">
        <input type="hidden" id="input_total" name="total_net" value="0.00">

        <div class="pt-4 border-t border-slate-100 flex flex-col sm:flex-row items-center justify-end gap-3">
            <button type="reset" onclick="resetFormDraft()"
                class="w-full sm:w-auto px-5 py-2.5 rounded-lg border border-slate-200 text-slate-600 font-medium hover:bg-slate-50 transition-colors cursor-pointer text-center">
                Reset Draft
            </button>
            <button type="submit" 
                class="w-full sm:w-auto px-6 py-2.5 rounded-lg bg-indigo-600 text-white font-semibold hover:bg-indigo-700 shadow-sm shadow-indigo-200 transition-colors cursor-pointer text-center">
                <i class="fa-solid fa-file-invoice-dollar mr-1.5"></i> Commit & Post Invoice
            </button>
        </div>
    </form>
</div>

<script>
const availableDrugs = {{ s["s2"] | tojson }};
const today = new Date();

// Format: YYYY-MM-DD
const dateStr = today.getFullYear() + '-' +
    String(today.getMonth() + 1).padStart(2, '0') + '-' +
    String(today.getDate()).padStart(2, '0');

document.getElementById('invoice-date').textContent = 'Invoice Date: ' + dateStr;

function initializeInvoiceEngine() {
    if (typeof $ !== 'undefined' && $.fn.select2) {
        $('#customer_select').select2({
            placeholder: "Search registered customer...",
            width: '100%'
        });
    }

    const container = document.getElementById('invoice-items-container');
    if (container && container.children.length === 0) {
        addInvoiceRow();
    }
}

if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", initializeInvoiceEngine);
} else {
    initializeInvoiceEngine();
}

// Handles switching conditions for Cash vs Credit rules
function toggleCreditTypeFields(selectedValue) {
    const bankWrapper = document.getElementById('bank-field-wrapper');
    const dateWrapper = document.getElementById('date-field-wrapper');
    const bankSelect = document.getElementById('bank_select');
    const returnDate = document.getElementById('return_date');

    if (selectedValue === 'cash') {
        // Show bank selection, make it required, hide and clean date fields
        bankWrapper.classList.remove('hidden');
        dateWrapper.classList.add('hidden');
        
        bankSelect.setAttribute('required', 'required');
        returnDate.removeAttribute('required');
        returnDate.value = '';
    } else if (selectedValue === 'credit') {
        // Show date input field, make it required, hide and clean bank selections
        dateWrapper.classList.remove('hidden');
        bankWrapper.classList.add('hidden');
        
        returnDate.setAttribute('required', 'required');
        bankSelect.removeAttribute('required');
        bankSelect.value = '';
    } else {
        // Reset state
        bankWrapper.classList.add('hidden');
        dateWrapper.classList.add('hidden');
        bankSelect.removeAttribute('required');
        returnDate.removeAttribute('required');
    }
}

function addInvoiceRow() {
    const container = document.getElementById('invoice-items-container');
    if (!container) return;
    
    const currentIndex = container.querySelectorAll('.invoice-item-row').length;
    const uniqueId = 'row_' + Date.now();

    let optionItems = '<option value="" disabled selected data-price="0" data-stock="0">Select drug stock...</option>';
    availableDrugs.forEach(drug => {
        optionItems += `<option value="${drug.id}" data-price="${drug.unitPrice}" data-stock="${drug.stock}">${drug.name} (Available: ${drug.stock})</option>`;
    });

    const rowMarkup = `
        <div id="${uniqueId}" class="invoice-item-row grid grid-cols-1 md:grid-cols-12 gap-3 p-4 md:p-2 bg-white md:bg-transparent border border-slate-100 md:border-none rounded-xl items-center">
            <div class="col-span-1 md:col-span-5">
                <label class="block md:hidden text-xs font-bold text-slate-500 mb-1">Drug Item</label>
                <select name="drugs[${currentIndex}][drug_id]" required class="drug-select-menu w-full" onchange="updateRowMath(this)">
                    ${optionItems}
                </select>
            </div>

            <div class="col-span-1 md:col-span-2">
                <label class="block md:hidden text-xs font-bold text-slate-500 mb-1">Unit Price</label>
                <input type="number" name="drugs[${currentIndex}][unit_price]" readonly step="0.01" value="0.00"
                    class="item-unit-price w-full px-3 py-2 text-sm bg-slate-50 border border-slate-200 text-slate-500 rounded-lg outline-none text-right md:text-left" tabindex="-1">
            </div>

            <div class="col-span-1 md:col-span-2">
                <label class="block md:hidden text-xs font-bold text-slate-500 mb-1">Quantity</label>
                <input type="number" name="drugs[${currentIndex}][quantity]" required min="1" value="1" oninput="handleQuantityValidation(this)"
                    class="item-quantity w-full px-3 py-2 text-sm border border-slate-200 text-slate-800 focus:border-indigo-500 focus:ring-1 focus:ring-indigo-100 rounded-lg outline-none text-center">
            </div>

            <div class="col-span-1 md:col-span-2 text-right">
                <label class="block md:hidden text-xs font-bold text-slate-500 mb-1">Row Total</label>
                <span class="item-row-total text-sm font-semibold text-slate-700 px-2 block pt-1">0.00</span>
            </div>

            <div class="col-span-1 md:col-span-1 text-center mt-2 md:mt-0">
                <button type="button" onclick="removeInvoiceRow(this)"
                    class="w-full md:w-auto p-2 bg-rose-50 text-rose-600 hover:bg-rose-100 rounded-lg transition-colors cursor-pointer inline-flex items-center justify-center">
                    <i class="fa-solid fa-trash-can text-sm"></i>
                </button>
            </div>
        </div>
    `;
    
    container.insertAdjacentHTML('beforeend', rowMarkup);

    if (typeof $ !== 'undefined' && $.fn.select2) {
        $(`#${uniqueId} .drug-select-menu`).select2({
            placeholder: "Search drug inventory...",
            width: '100%',
            minimumResultsForSearch: 0, 
            templateResult: function(data) {
                if (!data.id) return data.text;
                
                let isAlreadyChosen = false;
                $('.drug-select-menu').not($(`#${uniqueId} .drug-select-menu`)).each(function() {
                    if ($(this).val() === data.id) {
                        isAlreadyChosen = true;
                    }
                });
                
                if (isAlreadyChosen) return null;
                return data.text;
            }
        }).on('select2:select', function(e) {
            updateRowMath(this);
        });
    }
}

function handleQuantityValidation(quantityInput) {
    const rowNode = quantityInput.closest('.invoice-item-row');
    const select = rowNode.querySelector('.drug-select-menu');
    const selectedOption = select.options[select.selectedIndex];
    
    if (selectedOption && select.value !== "") {
        const availableStock = parseInt(selectedOption.getAttribute('data-stock')) || 0;
        let typedQty = parseInt(quantityInput.value) || 0;

        if (typedQty > availableStock) {
            alert(`Insufficient stock! Only (${availableStock}) items are left in inventory balance.`);
            quantityInput.value = availableStock; 
            quantityInput.classList.add('border-rose-500', 'bg-rose-50');
        } else {
            quantityInput.classList.remove('border-rose-500', 'bg-rose-50');
        }
    }
    calculateInvoiceTotals();
}

function removeInvoiceRow(buttonElement) {
    const container = document.getElementById('invoice-items-container');
    const rows = container.querySelectorAll('.invoice-item-row');
    
    if (rows.length > 1) {
        const row = buttonElement.closest('.invoice-item-row');
        if (typeof $ !== 'undefined' && $.fn.select2) {
            $(row).find('.drug-select-menu').select2('destroy');
        }
        row.remove();
        reindexFormNames();
        calculateInvoiceTotals();
    } else {
        alert("An invoice transaction record requires at least 1 medication entry row.");
    }
}

function updateRowMath(selectElement) {
    const selectedOption = selectElement.options[selectElement.selectedIndex];
    const baseUnitPrice = parseFloat(selectedOption.getAttribute('data-price')) || 0;
    
    const rowNode = selectElement.closest('.invoice-item-row');
    if (rowNode) {
        const priceInput = rowNode.querySelector('.item-unit-price');
        if (priceInput) priceInput.value = baseUnitPrice.toFixed(2);
        
        const qtyInput = rowNode.querySelector('.item-quantity');
        if (qtyInput) handleQuantityValidation(qtyInput);
    }
    calculateInvoiceTotals();
}

function calculateInvoiceTotals() {
    let grossSubtotal = 0;
    const rows = document.querySelectorAll('.invoice-item-row');

    rows.forEach(row => {
        const select = row.querySelector('.drug-select-menu');
        if (!select) return;
        
        const price = parseFloat(select.options[select.selectedIndex]?.getAttribute('data-price')) || 0;
        const qtyInput = row.querySelector('.item-quantity');
        const quantity = qtyInput ? (parseInt(qtyInput.value) || 0) : 0;
        
        const lineTotal = price * quantity;
        grossSubtotal += lineTotal;

        const totalLabel = row.querySelector('.item-row-total');
        if (totalLabel) totalLabel.innerText = lineTotal.toFixed(2);
    });

    const withholdingTax = grossSubtotal * 0.03;
    const netTotalPayable = grossSubtotal - withholdingTax;

    const subtotalDisplay = document.getElementById('invoice-subtotal');
    const withholdingDisplay = document.getElementById('invoice-withholding');
    const grandTotalDisplay = document.getElementById('invoice-grand-total');

    if (subtotalDisplay) subtotalDisplay.innerText = grossSubtotal.toFixed(2) + " ETB";
    if (withholdingDisplay) withholdingDisplay.innerText = "-" + withholdingTax.toFixed(2) + " ETB";
    if (grandTotalDisplay) grandTotalDisplay.innerText = netTotalPayable.toFixed(2) + " ETB";

    const inputSubtotal = document.getElementById('input_subtotal');
    const inputWithholding = document.getElementById('input_withholding');
    const inputTotal = document.getElementById('input_total');

    if (inputSubtotal) inputSubtotal.value = grossSubtotal.toFixed(2);
    if (inputWithholding) inputWithholding.value = withholdingTax.toFixed(2);
    if (inputTotal) inputTotal.value = netTotalPayable.toFixed(2);
}

function reindexFormNames() {
    const rows = document.querySelectorAll('.invoice-item-row');
    rows.forEach((row, index) => {
        const select = row.querySelector('.drug-select-menu');
        const price = row.querySelector('.item-unit-price');
        const qty = row.querySelector('.item-quantity');
        
        if (select) select.setAttribute('name', `drugs[${index}][drug_id]`);
        if (price) price.setAttribute('name', `drugs[${index}][unit_price]`);
        if (qty) qty.setAttribute('name', `drugs[${index}][quantity]`);
    });
}

function resetFormDraft() {
    setTimeout(() => {
        const container = document.getElementById('invoice-items-container');
        const rows = container.querySelectorAll('.invoice-item-row');
        rows.forEach((row, idx) => {
            if(idx > 0) {
                if (typeof $ !== 'undefined' && $.fn.select2) {
                    $(row).find('.drug-select-menu').select2('destroy');
                }
                row.remove();
            }
        });
        if (typeof $ !== 'undefined' && $.fn.select2) {
            $('#customer_select').val('').trigger('change');
            $('.drug-select-menu').val('').trigger('change');
        }
        toggleCreditTypeFields('');
        calculateInvoiceTotals();
    }, 100);
}



document.getElementById("image").addEventListener("change", function () {
    const file = this.files[0];

    if (!file) return;

    const maxSize = 1500 * 1024 * 1024; // 1500 MB

    if (file.size > maxSize) {
        alert("Image must be less than 1500 MB");
        this.value = "";
    }
});
</script>
