<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AcmeCorp</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for clean modern icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen flex items-center justify-center p-4">

    <!-- LOGIN CONTAINER CARD -->
    <div class="bg-white w-full max-w-md rounded-2xl border border-slate-200 shadow-xl overflow-hidden p-6 md:p-8 space-y-6">
        
        <!-- Company Logo & Header -->
        <div class="text-center space-y-2">
            
            <h1 class="text-2xl font-bold text-slate-900 tracking-tight">Haris Pharmaceuticals Import</h1>
            <p class="text-sm text-slate-500">welcome </p>
        </div>

        <!-- Notification / Error Box (Initially Hidden) -->
        <div id="error-alert" class="hidden flex items-start gap-3 bg-rose-50 border border-rose-100 text-rose-700 p-3 rounded-xl text-sm">
            <i class="fa-solid fa-circle-exclamation text-base mt-0.5 shrink-0"></i>
            <span id="error-message">Invalid credentials provided.</span>
        </div>

        <!-- LOGIN FORM -->

        <form id="login-form" class="space-y-4" onsubmit="handleLogin(event)" action="/log" method="POST">
            <!-- Email Field -->
            <div class="space-y-1.5">
                <label for="phone" class="text-xs font-semibold text-slate-600 uppercase tracking-wider">Phone Number</label>
              
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400 pointer-events-none">
                     <i class="fa-solid fa-phone"></i>
                    </span>
                    <input type="text" id="phone"  name="phone" required autocomplete="email" placeholder="+251" 
                        class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-indigo-500 focus:bg-white transition duration-200 text-sm placeholder:text-slate-400">
                </div>
            </div>

            <!-- Password Field -->
            <div class="space-y-1.5">
                <div class="flex items-center justify-between">
                    <label for="password" class="text-xs font-semibold text-slate-600 uppercase tracking-wider">Password</label>
                    <a href="/Forgot"  class="text-xs font-medium text-indigo-600 hover:underline">Forgot password?</a>
                </div>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400 pointer-events-none">
                        <i class="fa-solid fa-lock"></i>
                    </span>
                    <input type="password"  name="password" id="password" required autocomplete="current-password" placeholder="••••••••" 
                        class="w-full pl-10 pr-12 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-indigo-500 focus:bg-white transition duration-200 text-sm placeholder:text-slate-400">
                    <!-- Toggle Password Visibility Button -->
                    <button type="button" onclick="togglePasswordVisibility()" class="absolute inset-y-0 right-0 flex items-center pr-3.5 text-slate-400 hover:text-slate-600 focus:outline-none">
                        <i id="password-toggle-icon" class="fa-solid fa-eye text-sm"></i>
                    </button>
                </div>
            </div>

         

            <!-- Submit Button -->
            <button type="submit" id="submit-btn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-3 rounded-xl shadow-md shadow-indigo-600/10 transition duration-200 flex items-center justify-center gap-2 group">
                <span>Sign In</span>
                <i class="fa-solid fa-arrow-right text-xs transition-transform duration-200 group-hover:translate-x-1" id="btn-icon"></i>
            </button>
        </form>

        <!-- Footer Notice -->
        <div class="text-center text-xs text-slate-400 pt-2 border-t border-slate-100">
            Protected by enterprise grade encryption.
        </div>
    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        // Toggle password visibility field between text and password
           
            const errorAlert = document.getElementById('error-alert');
            const errorMessage = document.getElementById('error-message');
            const submitBtn = document.getElementById('submit-btn');
            const btnIcon = document.getElementById('btn-icon');
       
        function togglePasswordVisibility() {

            const passwordInput = document.getElementById('password');
            const icon = document.getElementById('password-toggle-icon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }
            let username = "{{con}}" === "True";
            console.log(username)
            if(username){
                errorMessage.textContent ="Invalid phone number or password..";
                errorAlert.classList.remove('hidden');
              
                
            }

        // Form handler logic
        function handleLogin(event) {
          // Stop page refresh
             const phone = document.getElementById('phone').value.trim();
             const password = document.getElementById('password').value.trim();
          

            // Simple client validation step
            if (!phone || password.length < 4) {
                errorMessage.textContent =password+ "Please enter a valid phone and strong password.";
                errorAlert.classList.remove('hidden');
                return;
            }
           

            // Hide previous errors and activate submission loader
            errorAlert.classList.add('hidden');
            submitBtn.disabled = true;
            submitBtn.classList.replace('bg-indigo-600', 'bg-indigo-400');
            submitBtn.innerHTML = `
                <i class="fa-solid fa-circle-notch animate-spin"></i>
                <span>Verifying credentials...</span>
            `;


            if (!phone.startsWith("+251") || phone.length < 13) {
                                errorMessage.textContent = "Please enter a valid Ethiopian phone number.+251*********";
                                errorAlert.classList.remove('hidden');
                                return;
                            }
       

            // Simulate server network latency response (1.5 seconds)
            
                // If successful redirect window to your dashboard page
                 
               document.getElementById('login-form').submit();
               console.log("man")
               
        
        }
    </script>
</body>
</html>
