<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Medicine Pricing</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen p-4 md:p-8">

    <div class="max-w-3xl mx-auto space-y-6">
        
        <div class="border-b border-slate-200 pb-4">
            <h1 class="text-2xl font-black text-slate-900 tracking-tight">Medicine Pricing Manager</h1>
            <p class="text-sm text-slate-500">Search for an active pharmaceutical item to view or adjust its unit price structure.</p>
        </div>

        <div class="bg-white p-6 rounded-2xl border border-slate-100 shadow-sm space-y-4 relative">
            <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider">
                <i class="fa-solid fa-magnifying-glass-md_medicine mr-1 text-slate-400"></i> Search & Select Medicine
            </label>
            
            <div class="relative">
                <input type="text" id="medicine-search-input" oninput="handleMedicineSearchFilter()" onfocus="showMedicineDropdown()" placeholder="Type medicine name, brand, or formula..." autocomplete="off"
                    class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm outline-none focus:border-indigo-500 focus:bg-white transition-all font-medium">
                <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                    <i class="fa-solid fa-capsules text-base"></i>
                </div>
            </div>

            <div id="medicine-search-dropdown" class="hidden absolute left-6 right-6 bg-white border border-slate-200 rounded-xl shadow-xl max-h-60 overflow-y-auto z-50 divide-y divide-slate-50 mt-1">
                </div>
        </div>

        <form id="price-update-form" action="{{f}}" method="POST" class="hidden bg-white rounded-2xl border border-slate-100 shadow-sm overflow-hidden transition-all duration-300">
            
            <div class="bg-slate-50 border-b border-slate-100 px-6 py-4 flex items-center justify-between">
                <div>
                    <h2 id="selected-med-name" class="font-bold text-slate-900 text-base">---</h2>
                    <p id="selected-med-sku" class="text-xs font-mono text-slate-400 mt-0.5">SKU: ---</p>
                </div>
                <span class="px-2.5 py-1 text-xs font-bold bg-indigo-50 text-indigo-700 rounded-lg border border-indigo-100 uppercase tracking-wider" id="selected-med-category">General</span>
            </div>

            <input type="hidden" id="form-medicine-id" name="medicine_id">

            <div class="p-6 grid grid-cols-1 sm:grid-cols-2 gap-6">
                <div class="bg-slate-50/60 p-4 rounded-xl border border-slate-100 space-y-1">
                    <span class="text-[11px] font-bold text-slate-400 uppercase tracking-wider block">Current Base Price</span>
                    <div class="text-2xl font-black text-slate-600 font-mono" id="current-price-display">0.00 ETB</div>
                    <p class="text-[11px] text-slate-400 italic">Last modification logged in system session records.</p>
                </div>

                <div class="space-y-2">
                    <label for="new-price-input" class="block text-xs font-bold text-slate-600 uppercase tracking-wider">
                        Fix New Selling Price <span class="text-rose-500">*</span>
                    </label>
                    <div class="relative rounded-xl shadow-sm">
                        <input type="number" step="0.01" min="0.01" required id="new-price-input" name="new_price" placeholder="0.00"
                            class="w-full pl-4 pr-14 py-3 bg-white border border-slate-200 text-slate-800 rounded-xl font-mono text-lg font-bold outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500">
                        <div class="absolute inset-y-0 right-0 pr-4 flex items-center pointer-events-none text-slate-400 font-bold text-sm">ETB</div>
                    </div>
                </div>
            </div>

            <div class="bg-slate-50 border-t border-slate-100 px-6 py-4 flex justify-end gap-3">
                <button type="button" onclick="resetPricingInterface()" class="px-4 py-2 rounded-xl border border-slate-200 text-slate-600 text-sm font-semibold hover:bg-slate-100 transition-colors cursor-pointer">
                    Cancel Selection
                </button>
                <button type="submit" class="px-5 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-semibold shadow-sm transition-colors cursor-pointer inline-flex items-center gap-1.5">
                    <i class="fa-solid fa-circle-check"></i> Save & Fix Price
                </button>
            </div>
        </form>

    </div>

    <script>
        // Backing source medicine catalog list matrix dictionary
        const medicineDatabase = {{ s["s1"] | tojson }};

        // Close searching elements if user clicks outside context bounds
        document.addEventListener("click", function(e) {
            const dropdown = document.getElementById("medicine-search-dropdown");
            const searchInput = document.getElementById("medicine-search-input");
            if (e.target !== dropdown && e.target !== searchInput) {
                dropdown.classList.add("hidden");
            }
        });

        function showMedicineDropdown() {
            handleMedicineSearchFilter();
        }

        // 1. Searches and matches list inputs against dataset criteria
        function handleMedicineSearchFilter() {
            const input = document.getElementById("medicine-search-input").value.toLowerCase().trim();
            const dropdown = document.getElementById("medicine-search-dropdown");
            dropdown.innerHTML = "";

            // Filtering evaluation cycle
            const matches = medicineDatabase.filter(item => {
                return item.name.toLowerCase().includes(input) || item.sku.toLowerCase().includes(input);
            });

            if (matches.length === 0) {
                dropdown.innerHTML = `<div class="p-4 text-xs text-slate-400 text-center italic">No medicinal assets found matching search criteria</div>`;
                dropdown.classList.remove("hidden");
                return;
            }

            // Output match segments options lists elements components loops
            matches.forEach(med => {
                const rowItem = document.createElement("div");
                rowItem.className = "p-3 hover:bg-slate-50 cursor-pointer flex items-center justify-between transition-colors";
                rowItem.onclick = () => selectMedicineTargetItem(med);
                
                rowItem.innerHTML = `
                    <div>
                        <div class="text-sm font-bold text-slate-800">${med.name}</div>
                        <div class="text-xs text-slate-400 font-mono">${med.sku}</div>
                    </div>
                    <div class="text-right">
                        <span class="text-xs bg-slate-100 text-slate-600 px-2 py-0.5 rounded font-bold font-mono">${med.currentPrice.toFixed(2)} ETB</span>
                    </div>
                `;
                dropdown.appendChild(rowItem);
            });

            dropdown.classList.remove("hidden");
        }

        // 2. Selects a medicine element from list and injects properties down inside the form box layout
        function selectMedicineTargetItem(medicineObject) {
            // Hide dropdown menu list immediately
            document.getElementById("medicine-search-dropdown").classList.add("hidden");
            
            // Sync current input value with selection string label
            document.getElementById("medicine-search-input").value = medicineObject.name;

            // Map and update form elements indicators parameters
            document.getElementById("form-medicine-id").value = medicineObject.id;
            document.getElementById("selected-med-name").innerText = medicineObject.name;
            document.getElementById("selected-med-sku").innerText = `SKU: ${medicineObject.sku}`;
            document.getElementById("selected-med-category").innerText = medicineObject.category;
            document.getElementById("current-price-display").innerText = `${medicineObject.currentPrice.toFixed(2)} ETB`;
            
            // Focus and populate input field placeholder cleanly
            const newPriceInput = document.getElementById("new-price-input");
            newPriceInput.value = "";
            newPriceInput.placeholder = medicineObject.currentPrice.toFixed(2);

            // Display form framework viewport elements smoothly
            const dynamicForm = document.getElementById("price-update-form");
            dynamicForm.classList.remove("hidden");
            newPriceInput.focus();
        }

        // 3. Clear interfaces out back to baseline states configurations rules
        function resetPricingInterface() {
            document.getElementById("medicine-search-input").value = "";
            document.getElementById("price-update-form").classList.add("hidden");
            document.getElementById("form-medicine-id").value = "";
        }
    </script>
</body>
</html>
