<div class="w-full max-w-3xl mx-auto my-auto p-2">
    <!-- Form Header -->
    <div class="mb-6 text-center md:text-left">
        <h2 class="text-xl font-bold text-slate-800">Register New Customer</h2>
        <p class="text-sm text-slate-500">Add profile details for a new patient or corporate client to track prescriptions and billing.</p>
    </div>

    <!-- Main Customer Registration Form -->
    <form action="{{f}}" method="POST" class="space-y-6 w-full">
        
        <!-- Row 1: Full Name & Phone Number -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
                <label for="customer_name" class="block text-sm font-semibold text-slate-700 mb-2">
                    <i class="fa-solid fa-user-plus text-slate-400 mr-1"></i> Full Name
                </label>
                <input type="text" id="customer_name" name="customer_name" required placeholder="e.g. Abebe Bikila"
                    class="w-full px-4 py-2.5 rounded-lg border border-slate-200 bg-slate-50/50 text-slate-800 focus:bg-white focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 transition-all outline-none">
            </div>
            
            <div>
                <label for="phone_number" class="block text-sm font-semibold text-slate-700 mb-2">
                    <i class="fa-solid fa-phone text-slate-400 mr-1"></i> Phone Number
                </label>
                <input type="tel" id="phone_number" name="phone_number" required placeholder="e.g. 0911000000"
                    class="w-full px-4 py-2.5 rounded-lg border border-slate-200 bg-slate-50/50 text-slate-800 focus:bg-white focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 transition-all outline-none">
            </div>
        </div>

        <!-- Row 2: Email Address (Optional) & Customer Category -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
                <label for="email" class="block text-sm font-semibold text-slate-700 mb-2">
                    <i class="fa-solid fa-envelope text-slate-400 mr-1"></i> Email Address <span class="text-xs text-slate-400 font-normal">(Optional)</span>
                </label>
                <input type="email" id="email" name="email" placeholder="name@example.com"
                    class="w-full px-4 py-2.5 rounded-lg border border-slate-200 bg-slate-50/50 text-slate-800 focus:bg-white focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 transition-all outline-none">
            </div>

    
        </div>

        <!-- Row 3: Physical Address / Location Description -->
        <div>
            <label for="address" class="block text-sm font-semibold text-slate-700 mb-2">
                <i class="fa-solid fa-location-dot text-slate-400 mr-1"></i> Address / Sub-City
            </label>
            <input type="text" id="address" name="address" placeholder="e.g. Bole Sub-City, Woreda 03"
                class="w-full px-4 py-2.5 rounded-lg border border-slate-200 bg-slate-50/50 text-slate-800 focus:bg-white focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 transition-all outline-none">
        </div>

        <!-- Row 4: Professional Pharmacy Notes (Allergies, Medical Conditions, etc.) -->
        <div>
            <label for="notes" class="block text-sm font-semibold text-slate-700 mb-2">
                <i class="fa-solid fa-clipboard text-slate-400 mr-1"></i> Important Clinical / Billing Notes <span class="text-xs text-slate-400 font-normal">(Optional)</span>
            </label>
            <textarea id="notes" name="notes" rows="3" placeholder="e.g. Penicillin allergy, demands specific brands, or corporate credit terms..."
                class="w-full px-4 py-2.5 rounded-lg border border-slate-200 bg-slate-50/50 text-slate-800 focus:bg-white focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 transition-all outline-none resize-none"></textarea>
        </div>

        <!-- Submit Button Row -->
        <div class="pt-4 border-t border-slate-100 flex flex-col sm:flex-row items-center justify-end gap-3">
            <button type="reset" 
                class="w-full sm:w-auto px-5 py-2.5 rounded-lg border border-slate-200 text-slate-600 font-medium hover:bg-slate-50 transition-colors cursor-pointer text-center">
                Reset Fields
            </button>
            <button type="submit" 
                class="w-full sm:w-auto px-6 py-2.5 rounded-lg bg-indigo-600 text-white font-semibold hover:bg-indigo-700 shadow-sm shadow-indigo-200 transition-colors cursor-pointer text-center">
                <i class="fa-solid fa-address-card mr-1.5"></i> Save Customer Profile
            </button>
        </div>
    </form>
</div>
