<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OTP List for Managers</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 p-6 font-sans">

    <div class="max-w-5xl mx-auto bg-white p-6 rounded-xl shadow-sm border border-slate-200">
        
        <div class="border-b border-slate-200 pb-4 mb-6">
            <h1 class="text-xl font-bold text-slate-900">Manager OTP Monitor</h1>
            <p class="text-sm text-slate-500">View current one-time passwords generated by users.</p>
        </div>

        <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-slate-100 text-xs font-bold text-slate-600 uppercase tracking-wider border-b border-slate-200">
                        <th class="p-3">User phone</th>
                        <th class="p-3">Name</th>
                        <th class="p-3 text-center">OTP Code</th>
                        <th class="p-3 text-center">Status</th>
                    </tr>
                </thead>
                <tbody id="otp-rows" class="text-sm divide-y divide-slate-200">
                    </tbody>
            </table>
        </div>

    </div>

    <script>
        // Simple sample data list you can change directly right here
        const sampleOtpData = {{ s["s1"] | tojson }};
         
   

        // Runs automatically when your browser finishes loading the page layout
        document.addEventListener("DOMContentLoaded", () => {
            const tbody = document.getElementById('otp-rows');
            tbody.innerHTML = "";

            sampleOtpData.forEach(item => {
                // Setup simple colors for the badges based on status
                let badgeColor = "bg-slate-100 text-slate-700";
                if (item.status === 'active') badgeColor = "bg-emerald-100 text-emerald-800 font-bold";
                if (item.status === 'expired') badgeColor = "bg-rose-100 text-rose-800";

                const rowHtml = `
                    <tr class="hover:bg-slate-50">
                        <td class="p-3 font-medium text-slate-900">${item.userEmail}</td>
                        <td class="p-3 text-slate-500">${item.operationScope}</td>
                        <td class="p-3 text-center font-mono font-bold text-indigo-600 text-base tracking-wider">${item.rawToken}</td>
                        <td class="p-3 text-center">
                            <span class="px-2.5 py-1 text-xs rounded-full ${badgeColor}">
                                ${item.status}
                            </span>
                        </td>
                    </tr>
                `;
                tbody.insertAdjacentHTML('beforeend', rowHtml);
            });
        });
    </script>
</body>
</html>
